project:
  type: book
  output-dir: docs
  post-render:
    - scripts/zip_book.py
  resources:
    - /resources/fonts/lexend/*.woff2

book:
  title: "HSMA Content Writing Manual"
  author: "Sammi Rosser"
  date: "02/11/2026"
  favicon: resources/favicon.png
  sidebar:
    logo: resources/hsma_logo_white_wide.png
  chapters:
    - index.qmd
    - how_an_hsma_day_runs.qmd
    - pacing_and_prior_knowledge.qmd
    - slidecrafting.qmd
    - colour_palette.qmd
    - accessibility_considerations.qmd
    - hsma_tech_stack.qmd

filters:
  - bergam0t/value-box

format:
  html:
    theme:
      - darkly
      - theme-dark.scss
    css: styles.css
    mainfont: Lexend
    title-block-banner: resources/banner.png
